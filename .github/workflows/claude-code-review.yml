name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The review reads the diff through the GitHub API (`gh pr diff`), never
          # from local history, so a shallow checkout is sufficient.
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Deliberately does NOT use code-review@claude-code-plugins. That plugin
          # spawns background agents and ends its turn to wait for them, which works
          # interactively but not here: in the headless SDK, end_turn is completion,
          # so the run terminates mid-review and posts nothing. See the PR that
          # introduced this change for the captured evidence.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request using the steps below, in order.

            CRITICAL EXECUTION CONSTRAINT. You are running headless in CI. There
            is no interactive session, so ending your turn ends the whole run.
            Never call ScheduleWakeup. Never dispatch an agent with
            run_in_background set to true. Every agent you dispatch must be
            synchronous, so its result returns to you within the same turn. Do
            not end your turn while any agent is outstanding or any confirmed
            finding is still unposted.

            1. Fetch the diff with `gh pr diff`, and read AGENTS.md. Treat
               AGENTS.md as binding: it documents this repository's architecture
               and invariants, including that `Game.allTets` is authoritative
               while `Game.landed` is a derived lookup, and that the browser
               runtime must stay dependency-free.

            2. Handle your own earlier review threads before reviewing again.
               This workflow re-runs on every push, so a pull request usually
               already carries threads you opened. List them with:

                 gh api graphql -f query='{repository(owner:"OWNER",name:"REPO")
                 {pullRequest(number:N){reviewThreads(first:50){nodes{id isResolved
                 isOutdated path line comments(first:20){nodes{author{login} body}}}}}}}'

               For each unresolved thread you opened:
               - If the current code addresses the finding, reply briefly
                 stating what changed. Do not write "Resolving", "Resolved", or
                 any other word claiming the thread's state -- the reply is a
                 comment, not a state transition, and resolution is proven only
                 by the steps below.
               - Then, as its own standalone tool call -- never joined to the
                 reply or to any other command -- invoke:
                 `gh api graphql -f query='mutation{resolveReviewThread(input:
                 {threadId:"THREAD_ID"}){thread{isResolved}}}'`
                 Inspect the response. Require
                 `data.resolveReviewThread.thread.isResolved == true`. If the
                 call is denied, errors, or returns `isResolved: false`, retry
                 it exactly once, again as a standalone call.
               - Whether or not the mutation reported success, re-run the
                 read-only thread query from step 2 and require `isResolved ==
                 true` for that thread before treating it as resolved or moving
                 on. Prose and a successful-looking mutation response are not
                 sufficient by themselves; only this follow-up query is.
               - If the mutation and its one retry both fail, or the follow-up
                 query still shows `isResolved: false`, leave the thread open.
                 Do not claim resolution anywhere. State the exact failure (the
                 error, the denial, or the false result) in the final summary
                 instead.
               - If someone replied disagreeing or asking a question, answer it
                 on that thread. Engage with the substance: if they are right,
                 say so plainly and resolve using the verified procedure above;
                 if they are not, explain why and leave it open. Never resolve a
                 thread merely because it was replied to, and never resolve a
                 thread a human opened.
               - If it is still unaddressed, leave it open and do not repeat the
                 same finding as a new comment later in this review.

               A thread marked outdated only means the line moved, not that the
               problem was fixed -- check the current code before deciding.

            3. Dispatch exactly two synchronous general-purpose review agents in
               a single message so they run in parallel. Give each the same
               instructions: independently review this PR for correctness
               problems -- logic errors, broken invariants, mishandled edge
               cases, and behaviour contradicting a function's name, its
               documentation, or the PR's stated intent. Tell each to trace the
               code by hand and report, for every candidate issue, the file and
               line, what goes wrong, and a concrete input that triggers it.
               Tell them to ignore formatting handled by `npm run lint`, and to
               report nothing rather than pad the list.

            4. Wait for both agents to return. Then validate their findings
               yourself against the real code. Keep a finding only if you can
               trace the specific failure it claims. Discard anything
               speculative, stylistic, already correct, or out of scope for the
               diff. Where the two agents agree, that is corroboration, not
               proof -- verify anyway. Prefer discarding a doubtful finding over
               posting a false positive.

            5. Post each surviving finding as an inline comment on the relevant
               line using mcp__github_inline_comment__create_inline_comment,
               including a committable suggestion where a concrete fix is clear.
               Do not raise anything that already has an open thread from step 2.

            6. End with a brief summary naming what you posted, what you replied
               to or resolved, and what you investigated and rejected. If nothing
               survived validation and there were no threads to handle, post no
               comments and say so.
          # --allowedTools is exclusive: anything not listed is denied, and in CI a
          # denial is silent -- the job still reports success with no review posted.
          # create_inline_comment is the action's purpose-built posting tool; without
          # it the review hand-rolls `gh api ... -F line=N`, which is far more fragile.
          # Bash is scoped to the read-only inspection commands the review needs.
          # Agent/Task must be listed or the parallel review agents are denied.
          # Both names are included because the allowlist is exclusive and a wrong
          # name fails silently; the surplus one is simply unused.
          # ScheduleWakeup is deliberately absent -- it is interactive-only and
          # calling it is what stranded the plugin mid-review.
          claude_args: '--allowedTools "Agent,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-tree:*),Read,Glob,Grep"'
          # If a review ever completes but posts nothing, add `show_full_output: true`
          # here: failures in this workflow are otherwise indistinguishable from
          # success, since the job reports green either way. Rerunning with
          # ACTIONS_STEP_DEBUG is NOT a substitute -- it adds GitHub step logging only
          # and emits no model output. Remove it again afterwards, since it writes
          # full model output to this repository's public Actions logs.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

